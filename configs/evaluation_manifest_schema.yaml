# ============================================================================
# Evaluation Manifest Schema (Pass 6 Audit-Grade Specification)
# Cryptographically verifiable metadata contract for algorithmic fairness evaluations.
# ============================================================================

schema_version: "1.0.0"
title: "Fairness Evaluation Manifest Schema"
description: "Specification of mandatory metadata required to reconstruct and verify any fairness evaluation run."

type: object
required:
  - manifest_version
  - evaluation_id
  - fingerprint
  - timestamp_utc
  - evaluator_version
  - benchmark_version
  - dataset_identity
  - dataset_sha256
  - target_definition
  - sensitive_attributes
  - feature_contract_version
  - selected_features
  - excluded_features
  - split_strategy
  - random_seeds
  - model_configuration
  - fairness_policy_configuration
  - missing_attribute_policy
  - result_classification
  - evidence_state
  - number_of_comparisons
  - analysis_type

properties:
  manifest_version:
    type: string
    example: "1.0.0"
  evaluation_id:
    type: string
    description: "Unique UUID identifying this evaluation execution."
  fingerprint:
    type: string
    description: "Deterministic SHA-256 hash of canonicalized evaluation configuration."
  timestamp_utc:
    type: string
    format: "date-time"
    description: "ISO 8601 UTC timestamp of execution."
  result_classification:
    type: string
    enum:
      - INTERNAL_ENGINEERING_VERIFICATION
      - SYNTHETIC_DGP_VALIDATION
      - INDEPENDENT_ORACLE_VALIDATION
      - EXTERNAL_REAL_DATA_VALIDATION
      - EXPLORATORY
      - LEGACY
      - FRAMEWORK_VALIDATION
      - SYNTHETIC_VERIFIED
      - EXTERNAL_PENDING_STAGING
      - EXTERNAL_AUDIT_READY
  evidence_state:
    type: string
    enum:
      - PASS
      - FAIL
      - INSUFFICIENT_EVIDENCE
    description: "Top-level decision state based on strict evidence hierarchy."
  evaluator_version:
    type: string
    example: "6.0.0"
  benchmark_version:
    type: string
    example: "1.1.0"
  dataset_identity:
    type: string
    example: "Synthetic Controlled Benchmark"
  dataset_sha256:
    type: string
    nullable: true
    description: "SHA-256 hash of source dataset file (if file-based), or null for memory DGP."
  dataset_provenance:
    type: object
    description: "Lineage, license terms, and sensitive attribute origin record."
  target_definition:
    type: string
    description: "Formal specification of outcome variable Y."
  sensitive_attributes:
    type: array
    items:
      type: string
  sensitive_attribute_provenance:
    type: object
    description: "Designation of REAL_OBSERVED, CONSTRUCTED_ATTRIBUTE, or SYNTHETIC."
  feature_contract_version:
    type: string
    example: "PRE_DISPATCH_VALID_v1"
  selected_features:
    type: array
    items:
      type: string
  excluded_features:
    type: array
    items:
      type: string
  split_strategy:
    type: string
    enum:
      - IID_HOLDOUT
      - GROUP_HOLDOUT
      - TEMPORAL_HOLDOUT
  grouping_strategy:
    type: string
    nullable: true
  temporal_strategy:
    type: string
    nullable: true
  random_seeds:
    type: array
    items:
      type: integer
  model_configuration:
    type: object
    description: "Model architecture, hyperparameters, and pipeline steps."
  threshold_configuration:
    type: object
    nullable: true
    description: "Threshold mitigation parameters (e.g. ThresholdOptimizer constraints, split)."
  fairness_policy_configuration:
    type: object
    description: "Administrative policy ID, version, and threshold tolerances."
    required:
      - policy_id
      - policy_version
      - name
  intersectional_specifications:
    type: object
    nullable: true
    description: "Component attributes, min group sizes, and provenance."
  uncertainty_configuration:
    type: object
    description: "Bootstrap method, CI level, seed, and valid fraction tolerance."
  bootstrap_configuration:
    type: object
    description: "Detailed iteration counts: requested, successful, discarded, and reasons."
  missing_attribute_policy:
    type: string
    enum:
      - REJECT
      - EXCLUDE
      - EXPLICIT_UNKNOWN_GROUP
      - IMPUTE_WITH_DOCUMENTED_RULE
  analysis_type:
    type: string
    enum:
      - SCREENING_ANALYSIS
      - CONFIRMATORY_ANALYSIS
  number_of_comparisons:
    type: integer
    description: "Total hypothesis / subgroup checks performed across the evaluation."
  worst_group_selection_disclosure:
    type: object
    nullable: true
    description: "Disclosure of extreme-value selection bias for flagged groups."
  result_artifact_paths:
    type: array
    items:
      type: string
  warnings:
    type: array
    items:
      type: string
  abstentions:
    type: array
    items:
      type: string
  resampling_unit:
    type: string
    enum:
      - ROW_BOOTSTRAP
      - CLUSTER_BOOTSTRAP
  cluster_key:
    type: string
    nullable: true
  confidence_method:
    type: string
  leakage_findings:
    type: array
    items:
      type: object
  statistical_estimand:
    type: object
    nullable: true
    description: "Formal evaluation estimand contract."
